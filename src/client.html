<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Quest 2</title>
<!-- wterm, built from its npm package and served by the game's server. -->
<link rel="stylesheet" href="/wterm.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #111; color: #aaa; font: 14px system-ui, sans-serif; }
  #screen { padding: 8px; background: #000; border: 1px solid #333; }
  #status { min-height: 1.4em; }
  button { font: inherit; padding: 4px 12px; }
  /* The terminal: black, with xterm's 16 colours (the game sends its
     colours as RGB, so these are only a fallback). */
  .wterm {
    --term-bg: #000000;
    --term-fg: #ffffff;
    --term-cursor: #ffffff;
    --term-font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace;
    --term-font-size: 16px;
    --term-row-height: 19px;
    --term-color-0: #000000;
    --term-color-1: #cd0000;
    --term-color-2: #00cd00;
    --term-color-3: #cdcd00;
    --term-color-4: #0000ee;
    --term-color-5: #cd00cd;
    --term-color-6: #00cdcd;
    --term-color-7: #e5e5e5;
    --term-color-8: #7f7f7f;
    --term-color-9: #ff0000;
    --term-color-10: #00ff00;
    --term-color-11: #ffff00;
    --term-color-12: #5c5cff;
    --term-color-13: #ff00ff;
    --term-color-14: #00ffff;
    --term-color-15: #ffffff;
  }
</style>
</head>
<body>
<div id="screen"></div>
<div id="status">Connecting...</div>
<button id="again" hidden>Connect again</button>
<script type="module">
  import { WTerm } from '/wterm.js';

  // The game is 80x25 cells; the page sends what's typed and draws what
  // the server sends. Each connection gets a new terminal, so nothing of
  // the last one (its screens, scrolled back to) is left.
  let ws = null;
  let term = null;
  const screen = document.getElementById('screen');
  const status = document.getElementById('status');
  const again = document.getElementById('again');

  async function connect() {
    term?.destroy();
    term = new WTerm(screen, {
      cols: 80,
      rows: 25,
      autoResize: false,
      cursorBlink: true,
      onData: (data) => {
        if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data }));
      },
    });
    await term.init();
    again.hidden = true;
    status.textContent = 'Connecting...';
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => {
      status.textContent = 'Connected.';
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      term.focus();
    };
    ws.onmessage = (event) => term.write(event.data);
    ws.onclose = () => {
      status.textContent = 'Disconnected.';
      again.hidden = false;
    };
  }

  again.addEventListener('click', connect);
  connect();
</script>
</body>
</html>
